  GOSTLY_WORKER_MAX_CONCURRENT: ${GOSTLY_WORKER_MAX_CONCURRENT:-1}
  GOSTLY_WORKER_MAX_CONCURRENT_PER_TENANT: ${GOSTLY_WORKER_MAX_CONCURRENT_PER_TENANT:-1}
  GOSTLY_WORKER_POLL_INTERVAL_SECS: ${GOSTLY_WORKER_POLL_INTERVAL_SECS:-2.0}
  GOSTLY_WORKER_RECONCILIATION_BACKOFF_SECS: ${GOSTLY_WORKER_RECONCILIATION_BACKOFF_SECS:-30}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
