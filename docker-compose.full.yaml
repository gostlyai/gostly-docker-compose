# Gostly AI — Self-hosted proxy (Full)
#
# This file ships the Full stack: the proxy + control plane + Postgres
# PLUS the inference router and the llama.cpp sidecar that powers generated
# mocks. docker-compose.yaml beside this file is the Lite stack, without the
# AI services; ./setup.sh asks which one to run and writes the choice to .env
# as COMPOSE_FILE.
#
# Install (README.md has every step, the settings and the manual alternative):
#   1. Get your license key from https://gostly.ai/dashboard.
#   2. Run ./setup.sh in this directory. It makes your private .env from
#      .template.env, checks the key, signs in to the Gostly registry with it
#      (the token reaches docker login on --password-stdin, never the command
#      line) and starts the stack. Keep .env across upgrades: it holds the
#      database passwords and GOSTLY_TENANT_ID.
#   3. Open http://localhost:3000. A fresh .env starts on the bundled demo
#      upstream (COMPOSE_PROFILES=demo with
#      BACKEND_URL=http://gostly-demo-upstream:8080); its comments say how to
#      switch BACKEND_URL to your own service.

# ghost-web's environment. ghost-migrate below takes all of it too, plus its
# migration mode and the schema-owner credentials, so its key bootstrap runs
# the API's own production start check with the API's settings, the boot
# ingest of the service definition runs under the API's tenant and license,
# and its two admin commands (erase-replay, and audit-prune under the
# retention floor) run with the settings the API runs with.
# Add a setting here, not to one service, unless only that service may hold it.
x-ghost-web-env: &ghost-web-env
  GOSTLY_AUDIT_RETENTION_DAYS: ${GOSTLY_AUDIT_RETENTION_DAYS:-365}
  # Production posture by default: the development authentication bypass is
  # ignored and logs are structured. The API starts only once ghost-migrate
  # has created the shared service credential in the data volume.
  ENVIRONMENT:          ${ENVIRONMENT:-production}
  LOG_FORMAT:           ${LOG_FORMAT:-json}
  # Optional operator pin. ghost-migrate reads the same value from this list,
  # so the two agree about the key file. When set it is the service key: it is mirrored to /data/service.key (which ghost-proxy
  # reads, so the proxy is not wired), it is visible in this container's
  # metadata, its format is not validated, and key rotation is refused.
  GHOST_API_KEY:        ${GHOST_API_KEY:-}
  GOSTLY_LICENSE_KEY:   ${GOSTLY_LICENSE_KEY:-}
  # Optional stable tenant pin. Installer-generated .env files set this
  # to the platform organization UUID; empty preserves legacy/manual use.
  GOSTLY_TENANT_ID:     ${GOSTLY_TENANT_ID:-}
  # Rollout gates, on since 2026.11.0: each was held off while an older replica
  # could still run, and a Compose install replaces ghost-web in one step. Set one to
  # 0 in .env to turn it off (setup.sh turns an old false on); README.md, "Off by default",
  # says what each does. Time Chamber mutations are snapshot, fork and reset
  # through this service's REST routes and the keyed MCP episode tools; the
  # proxy's own /ghost/* episode routes do not need the gate.
  TRAINING_VERSION_ARCHIVE_ENABLED: ${TRAINING_VERSION_ARCHIVE_ENABLED:-true}
  ACTIVITIES_V2_ENABLED: ${ACTIVITIES_V2_ENABLED:-true}
  GOSTLY_SHARED_EPISODE_MUTATIONS_ENABLED: ${GOSTLY_SHARED_EPISODE_MUTATIONS_ENABLED:-true}
  GOSTLY_RECEIPT_TRANSITION_WORKER: ${GOSTLY_RECEIPT_TRANSITION_WORKER:-1}
  # Telemetry opt-out passthrough — set GOSTLY_TELEMETRY=off in .env to
  # disable the api's daily dashboard-funnel shipper, the same lever
  # that disables the agent's shipper (see .env.example).
  GOSTLY_TELEMETRY:     ${GOSTLY_TELEMETRY:-}
  AGENT_URL:            http://ghost-proxy:8080
  # /eval/run proxy timeout (seconds) — scales with output budget × holdout
  # size (see .env.example).
  GOSTLY_EVAL_TIMEOUT_S: ${GOSTLY_EVAL_TIMEOUT_S:-300}
  GOSTLY_EVAL_ATTEMPT_MAX_HORIZON_S: ${GOSTLY_EVAL_ATTEMPT_MAX_HORIZON_S:-3600}
  GOSTLY_EVAL_LEASE_GRACE_S: ${GOSTLY_EVAL_LEASE_GRACE_S:-30}
  INFERENCE_URL:        http://ghost-inference:5000
  API_BASE_URL:         http://ghost-web:8000
  MOCK_DIR:             /data/mocks
  TRAFFIC_LOG_DIR:      /data/traffic
  # Inbound webhooks and WebSocket frames: the directory ghost-proxy writes
  # ({service_id}.jsonl) and the sync loop imports into the dashboard.
  WEBHOOK_DIR:          /data/webhooks
  # Wide events (one per recorded request), on by default. Set
  # ENABLE_OBSERVABILITY=false in .env to turn them off in both services: the
  # proxy writes WIDE_EVENTS_DIR and this service imports it, so both name
  # the same directory on the data volume.
  ENABLE_OBSERVABILITY: ${ENABLE_OBSERVABILITY:-true}
  WIDE_EVENTS_DIR:      /data/wide_events
  ALLOWED_ORIGINS:      ${ALLOWED_ORIGINS:-http://localhost:3000}
  # The API's MCP Origin allowlist defaults to empty (fail closed). This
  # local topology explicitly opts in only the dashboard origin published
  # above. Override with the exact browser origin if you change that URL;
  # wildcards and regexes are intentionally rejected.
  MCP_ALLOWED_ORIGINS:  ${MCP_ALLOWED_ORIGINS:-http://localhost:3000}
  # Raw MCP POST ceiling, enforced before UTF-8 or JSON decoding.
  MCP_MAX_REQUEST_BODY_BYTES: ${MCP_MAX_REQUEST_BODY_BYTES:-1048576}
  OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
  # Exact private origins (scheme://host:port, comma-separated) that webhook
  # and canary replay may reach; empty admits none. Internal OpenAPI spec
  # hosts are to use this same list; URL import does not read it yet.
  GOSTLY_OUTBOUND_ALLOWED_PRIVATE_ORIGINS: ${GOSTLY_OUTBOUND_ALLOWED_PRIVATE_ORIGINS:-}
  # Runtime connections use only the non-owner roles created by the
  # short-lived ghost-migrate job. Owner/bootstrap values are deliberately
  # absent from this long-lived container's environment and metadata.
  DATABASE_URL:         ${DATABASE_URL:-postgresql://gostly_app:${GOSTLY_APP_DB_PASSWORD:?GOSTLY_APP_DB_PASSWORD must be set}@ghost-postgres:5432/${POSTGRES_DB:-ghost}}
  SERVICE_DATABASE_URL: ${SERVICE_DATABASE_URL:-postgresql://gostly_service:${GOSTLY_SERVICE_DB_PASSWORD:?GOSTLY_SERVICE_DB_PASSWORD must be set}@ghost-postgres:5432/${POSTGRES_DB:-ghost}}
  GOSTLY_AUTH_MODE:                ${GOSTLY_AUTH_MODE:-password}
  GOSTLY_ADMIN_EMAIL:              ${GOSTLY_ADMIN_EMAIL:-}
  GOSTLY_ADMIN_PASSWORD:           ${GOSTLY_ADMIN_PASSWORD:-}
  GOSTLY_ADMIN_FULL_NAME:          ${GOSTLY_ADMIN_FULL_NAME:-}
  GOSTLY_AUTH_SESSION_TTL_HOURS:   ${GOSTLY_AUTH_SESSION_TTL_HOURS:-12}
  GOSTLY_AUTH_SESSION_IDLE_MINUTES: ${GOSTLY_AUTH_SESSION_IDLE_MINUTES:-0}
  GOSTLY_AUTH_SIGN_IN_PER_MINUTE:  ${GOSTLY_AUTH_SIGN_IN_PER_MINUTE:-10}
  GOSTLY_AUTH_SIGN_IN_PER_HOUR:    ${GOSTLY_AUTH_SIGN_IN_PER_HOUR:-30}
  # Socket peers whose X-Forwarded-For names the client (sign-in throttling, audit,
  # session addresses). The default trusts loopback and this network's Docker gateway:
  # a reverse proxy on the Docker host, or a browser on it. A proxy elsewhere goes here
  # too, as ghost-web sees it (another container: its address on this network).
  TRUSTED_PROXIES:                 ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,gateway}
  GOSTLY_AUTH_COOKIE_SECURE:       ${GOSTLY_AUTH_COOKIE_SECURE:-true}
  GOSTLY_AUTH_COOKIE_DOMAIN:       ${GOSTLY_AUTH_COOKIE_DOMAIN:-}
  GOSTLY_AUTH_ALLOWED_DOMAINS:     ${GOSTLY_AUTH_ALLOWED_DOMAINS:-}
  GOSTLY_AUTH_AUTO_PROVISION:      ${GOSTLY_AUTH_AUTO_PROVISION:-true}
  GOSTLY_AUTH_DEFAULT_ROLE:        ${GOSTLY_AUTH_DEFAULT_ROLE:-viewer}
  GOSTLY_AUTH_GROUP_TO_ROLE_MAP:   ${GOSTLY_AUTH_GROUP_TO_ROLE_MAP:-}
  GOSTLY_SAML_IDP_METADATA_URL:    ${GOSTLY_SAML_IDP_METADATA_URL:-}
  GOSTLY_SAML_IDP_METADATA_XML:    ${GOSTLY_SAML_IDP_METADATA_XML:-}
  GOSTLY_SAML_IDP_ENTITY_ID:       ${GOSTLY_SAML_IDP_ENTITY_ID:-}
  GOSTLY_SAML_SP_ENTITY_ID:        ${GOSTLY_SAML_SP_ENTITY_ID:-}
  GOSTLY_SAML_SP_ACS_URL:          ${GOSTLY_SAML_SP_ACS_URL:-}
  GOSTLY_SAML_SP_SLO_URL:          ${GOSTLY_SAML_SP_SLO_URL:-}
  GOSTLY_SAML_GROUP_ATTRIBUTE:     ${GOSTLY_SAML_GROUP_ATTRIBUTE:-memberOf}
  GOSTLY_SAML_EMAIL_ATTRIBUTE:     ${GOSTLY_SAML_EMAIL_ATTRIBUTE:-email}
  GOSTLY_SAML_NAME_ATTRIBUTE:      ${GOSTLY_SAML_NAME_ATTRIBUTE:-displayName}
  # Signed AuthnRequests: the SP certificate and key, each inline or (its
  # _FILE variant) as the path of a file mounted into the container.
  GOSTLY_SAML_SP_X509_CERT:        ${GOSTLY_SAML_SP_X509_CERT:-}
  GOSTLY_SAML_SP_X509_CERT_FILE:   ${GOSTLY_SAML_SP_X509_CERT_FILE:-}
  GOSTLY_SAML_SP_PRIVATE_KEY:      ${GOSTLY_SAML_SP_PRIVATE_KEY:-}
  GOSTLY_SAML_SP_PRIVATE_KEY_FILE: ${GOSTLY_SAML_SP_PRIVATE_KEY_FILE:-}
  GOSTLY_OIDC_ISSUER:              ${GOSTLY_OIDC_ISSUER:-}
  GOSTLY_OIDC_CLIENT_ID:           ${GOSTLY_OIDC_CLIENT_ID:-}
  # One client credential: the secret inline or from a mounted file, or a
  # private key file for private_key_jwt.
  GOSTLY_OIDC_CLIENT_SECRET:       ${GOSTLY_OIDC_CLIENT_SECRET:-}
  GOSTLY_OIDC_CLIENT_SECRET_FILE:  ${GOSTLY_OIDC_CLIENT_SECRET_FILE:-}
  GOSTLY_OIDC_CLIENT_KEY_FILE:     ${GOSTLY_OIDC_CLIENT_KEY_FILE:-}
  GOSTLY_OIDC_REDIRECT_URI:        ${GOSTLY_OIDC_REDIRECT_URI:-}
  GOSTLY_OIDC_SCOPES:              ${GOSTLY_OIDC_SCOPES:-openid email profile groups}
  GOSTLY_OIDC_EMAIL_CLAIM:         ${GOSTLY_OIDC_EMAIL_CLAIM:-email}
  GOSTLY_OIDC_NAME_CLAIM:          ${GOSTLY_OIDC_NAME_CLAIM:-name}
  GOSTLY_OIDC_GROUP_CLAIM:         ${GOSTLY_OIDC_GROUP_CLAIM:-groups}
  GOSTLY_OIDC_DISPLAY_NAME:        ${GOSTLY_OIDC_DISPLAY_NAME:-}
  # The install key that seals the secrets the API stores (provider keys, model
  # connection credentials), on a volume of its own: the data volume, its backups
  # and a database dump never carry it. The API creates it on the first saved
  # secret; back the secret-store volume up apart from the database.
  GOSTLY_SECRET_STORE_KEY_FILE: /var/lib/gostly/secret-store/secret-store.key
  # >>> generated by api/tests/_configuration_catalogue.py sync: the operator settings this service reads
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DRIFT_MATVIEW_REFRESH_ENABLED: ${DRIFT_MATVIEW_REFRESH_ENABLED:-1}
  DRIFT_MATVIEW_REFRESH_INTERVAL_SECS: ${DRIFT_MATVIEW_REFRESH_INTERVAL_SECS:-300}
  DRIFT_MATVIEW_REFRESH_JITTER_SECS: ${DRIFT_MATVIEW_REFRESH_JITTER_SECS:-30}
  DRIFT_MATVIEW_REFRESH_STATEMENT_TIMEOUT_SECS: ${DRIFT_MATVIEW_REFRESH_STATEMENT_TIMEOUT_SECS:-120}
  ENABLE_AI_MOCK_REPAIR: ${ENABLE_AI_MOCK_REPAIR:-false}
  ENABLE_UPSTREAM_ALIGNMENT_SYNC: ${ENABLE_UPSTREAM_ALIGNMENT_SYNC:-false}
  GOSTLY_AGENT_SESSION_MAX_AGE_DAYS: ${GOSTLY_AGENT_SESSION_MAX_AGE_DAYS:-365}
  GOSTLY_CAPTURE_MAX_AGE_DAYS: ${GOSTLY_CAPTURE_MAX_AGE_DAYS:-}
  GOSTLY_DRIFT_CHECK_MAX_EVENTS_PER_CHECK: ${GOSTLY_DRIFT_CHECK_MAX_EVENTS_PER_CHECK:-500}
  GOSTLY_DRIFT_CHECK_MAX_PROJECTED_BYTES_PER_CHECK: ${GOSTLY_DRIFT_CHECK_MAX_PROJECTED_BYTES_PER_CHECK:-12582912}
  GOSTLY_DRIFT_CHECK_MAX_PROJECTED_BYTES_PER_SESSION: ${GOSTLY_DRIFT_CHECK_MAX_PROJECTED_BYTES_PER_SESSION:-8388608}
  GOSTLY_DRIFT_CHECK_MAX_RECURSIVE_NODES_PER_CHECK: ${GOSTLY_DRIFT_CHECK_MAX_RECURSIVE_NODES_PER_CHECK:-24000}
  GOSTLY_DRIFT_CHECK_MAX_RECURSIVE_NODES_PER_SESSION: ${GOSTLY_DRIFT_CHECK_MAX_RECURSIVE_NODES_PER_SESSION:-16000}
  GOSTLY_DRIFT_CHECK_MAX_ROUTES_PER_CHECK: ${GOSTLY_DRIFT_CHECK_MAX_ROUTES_PER_CHECK:-1500}
  GOSTLY_DRIFT_CHECK_MAX_ROUTES_PER_SESSION: ${GOSTLY_DRIFT_CHECK_MAX_ROUTES_PER_SESSION:-1000}
  GOSTLY_DRIFT_CHECK_MAX_ROWS_PER_CHECK: ${GOSTLY_DRIFT_CHECK_MAX_ROWS_PER_CHECK:-8000}
  GOSTLY_DRIFT_CHECK_MAX_ROWS_PER_SESSION: ${GOSTLY_DRIFT_CHECK_MAX_ROWS_PER_SESSION:-5000}
  GOSTLY_MODEL_ALLOWED_PRIVATE_ORIGINS: ${GOSTLY_MODEL_ALLOWED_PRIVATE_ORIGINS:-}
  GOSTLY_NOTIFY_CONFIG: ${GOSTLY_NOTIFY_CONFIG:-}
  GOSTLY_NOTIFY_SECRET: ${GOSTLY_NOTIFY_SECRET:-}
  GOSTLY_NOTIFY_SECRET_FILE: ${GOSTLY_NOTIFY_SECRET_FILE:-}
  GOSTLY_NOTIFY_URL: ${GOSTLY_NOTIFY_URL:-}
  GOSTLY_NOTIFY_URL_FILE: ${GOSTLY_NOTIFY_URL_FILE:-}
  GOSTLY_OUTBOUND_ALLOWED_ORIGINS: ${GOSTLY_OUTBOUND_ALLOWED_ORIGINS:-}
  GOSTLY_PROXY_PUBLIC_URL: ${GOSTLY_PROXY_PUBLIC_URL:-}
  GOSTLY_PUBLIC_URL: ${GOSTLY_PUBLIC_URL:-}
  GOSTLY_STUDIO_RESULT_TTL_DAYS: ${GOSTLY_STUDIO_RESULT_TTL_DAYS:-7}
  GOSTLY_TELEMETRY_TIER: ${GOSTLY_TELEMETRY_TIER:-}
  GOSTLY_TRANSITION_CALIBRATION_MAX_LEGACY_CALLS: ${GOSTLY_TRANSITION_CALIBRATION_MAX_LEGACY_CALLS:-100}
  GOSTLY_TRANSITION_MAX_CONCURRENT: ${GOSTLY_TRANSITION_MAX_CONCURRENT:-4}
